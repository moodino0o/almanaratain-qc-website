openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: qc
    description: Quality control operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Archive
    description: Private quality control document archive.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [qc]
      summary: Get QC dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /lookups:
    get:
      operationId: getLookups
      tags: [qc]
      summary: Get quality control lookup values
      responses:
        "200":
          description: Lookup values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lookups"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Auth status resolved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the authorization endpoint
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser login flow
      responses:
        "302":
          description: Redirect to the requested application path
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the browser session
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect after logout
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile authorization code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a private presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid file metadata
        "401":
          description: Authentication required
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a private stored object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "404":
          description: Object not found
  /archive:
    get:
      tags: [Archive]
      operationId: listArchive
      summary: List the private document archive
      responses:
        "200":
          description: Archive folders and documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveResponse"
        "401":
          description: Authentication required
  /archive/documents:
    post:
      tags: [Archive]
      operationId: createArchiveDocument
      summary: Save uploaded document metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveDocumentInput"
      responses:
        "201":
          description: Document metadata saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveDocument"
        "400":
          description: Invalid document metadata
        "401":
          description: Authentication required
  /archive/documents/{id}:
    get:
      tags: [Archive]
      operationId: getArchiveDocument
      summary: Get one archived document
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      responses:
        "200":
          description: Archived document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveDocument"
        "401":
          description: Authentication required
        "404":
          description: Document not found
    patch:
      tags: [Archive]
      operationId: updateArchiveDocument
      summary: Update archived document metadata
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveDocumentUpdate"
      responses:
        "200":
          description: Updated archived document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveDocument"
        "400":
          description: Invalid document metadata
        "401":
          description: Authentication required
        "404":
          description: Document not found
    delete:
      tags: [Archive]
      operationId: retireArchiveDocument
      summary: Retire an archived document and remove its stored file
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      responses:
        "204":
          description: Document retired
        "401":
          description: Authentication required
        "403":
          description: Archive manager access required
        "404":
          description: Document not found
        "500":
          description: Unable to clean up the stored file or metadata
  /archive/documents/{id}/content:
    get:
      tags: [Archive]
      operationId: getArchiveDocumentContent
      summary: Review or download an archived document
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      responses:
        "200":
          description: Original document content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "404":
          description: Document not found
  /archive/documents/{id}/download:
    get:
      tags: [Archive]
      operationId: downloadArchiveDocument
      summary: Download an archived document
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      responses:
        "200":
          description: Original document download
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "404":
          description: Document not found
  /reference-data:
    get:
      operationId: getReferenceData
      tags: [qc]
      summary: List editable quality control reference data
      responses:
        "200":
          description: Reference categories and values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceData"
  /reference-data/categories:
    post:
      operationId: createReferenceCategory
      tags: [qc]
      summary: Create a reference data category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceCategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceCategory"
  /reference-data/categories/{id}:
    patch:
      operationId: updateReferenceCategory
      tags: [qc]
      summary: Update a reference data category
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceCategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceCategory"
    delete:
      operationId: deleteReferenceCategory
      tags: [qc]
      summary: Delete a reference data category
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      responses:
        "204":
          description: Category deleted
  /reference-data/categories/{categoryId}/items:
    post:
      operationId: createReferenceItem
      tags: [qc]
      summary: Add a value to a reference data category
      parameters:
        - $ref: "#/components/parameters/CategoryIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceItemInput"
      responses:
        "201":
          description: Created reference value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceItem"
  /reference-data/items/{id}:
    patch:
      operationId: updateReferenceItem
      tags: [qc]
      summary: Update a reference data value
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceItemInput"
      responses:
        "200":
          description: Updated reference value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceItem"
    delete:
      operationId: deleteReferenceItem
      tags: [qc]
      summary: Delete a reference data value
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      responses:
        "204":
          description: Reference value deleted
  /strength-standards:
    get:
      operationId: listStrengthStandards
      tags: [qc]
      summary: List configurable compressive strength standards
      responses:
        "200":
          description: Configured strength standards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrengthStandard"
    post:
      operationId: createStrengthStandard
      tags: [qc]
      summary: Create a compressive strength standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrengthStandardInput"
      responses:
        "201":
          description: Created strength standard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrengthStandard"
  /strength-standards/{id}:
    patch:
      operationId: updateStrengthStandard
      tags: [qc]
      summary: Update a compressive strength standard
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrengthStandardUpdate"
      responses:
        "200":
          description: Updated strength standard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrengthStandard"
    delete:
      operationId: deleteStrengthStandard
      tags: [qc]
      summary: Delete a compressive strength standard
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      responses:
        "204":
          description: Strength standard deleted
  /sieve-standards:
    get:
      operationId: listSieveStandards
      tags: [qc]
      summary: List configurable sieve acceptance standards
      responses:
        "200":
          description: Configured sieve standards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SieveStandard"
    post:
      operationId: createSieveStandard
      tags: [qc]
      summary: Create a sieve acceptance standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SieveStandardInput"
      responses:
        "201":
          description: Created sieve standard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SieveStandard"
  /sieve-standards/{id}:
    patch:
      operationId: updateSieveStandard
      tags: [qc]
      summary: Update a sieve acceptance standard
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SieveStandardUpdate"
      responses:
        "200":
          description: Updated sieve standard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SieveStandard"
    delete:
      operationId: deleteSieveStandard
      tags: [qc]
      summary: Delete a sieve acceptance standard
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      responses:
        "204":
          description: Sieve standard deleted
  /records:
    get:
      operationId: listRecords
      tags: [qc]
      summary: List quality control records
      parameters:
        - $ref: "#/components/parameters/TestTypeParam"
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Quality control records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QcRecord"
    post:
      operationId: createRecord
      tags: [qc]
      summary: Create a quality control record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QcRecordInput"
      responses:
        "201":
          description: Created record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QcRecord"
  /daily-ready-mix-results:
    get:
      operationId: getDailyReadyMixResults
      tags: [qc]
      summary: Get daily Ready Mix strength results
      parameters:
        - name: sampleDate
          in: query
          required: true
          schema:
            type: string
            description: Sample date in YYYY-MM-DD format
        - name: mixDesign
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: referenceType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/DailyReadyMixReferenceType"
      responses:
        "200":
          description: Daily Ready Mix strength results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReadyMixResults"
  /records/{id}:
    get:
      operationId: getRecord
      tags: [qc]
      summary: Get one quality control record
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      responses:
        "200":
          description: Quality control record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QcRecord"
        "404":
          description: Record not found
    patch:
      operationId: updateRecord
      tags: [qc]
      summary: Update a quality control record
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QcRecordUpdate"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QcRecord"
    delete:
      operationId: deleteRecord
      tags: [qc]
      summary: Delete a quality control record
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      responses:
        "204":
          description: Record deleted
  /reports/{id}:
    get:
      operationId: getReport
      tags: [qc]
      summary: Get a print-ready report record
      parameters:
        - $ref: "#/components/parameters/RecordIdParam"
      responses:
        "200":
          description: Print-ready quality control report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
components:
  parameters:
    RecordIdParam:
      name: id
      in: path
      required: true
      schema:
        type: number
    TestTypeParam:
      name: testType
      in: query
      schema:
        $ref: "#/components/schemas/TestType"
    SearchParam:
      name: search
      in: query
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      schema:
        type: number
        minimum: 1
        maximum: 100
        default: 50
    CategoryIdParam:
      name: categoryId
      in: path
      required: true
      schema:
        type: number
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TestType:
      type: string
      enum:
        - Ready Mix
        - Blocks
        - Paving Blocks
        - Sand Sieve
        - Aggregate Sieve
        - Water
        - Flakiness & Elongation
        - RMX Trial
    RecordStatus:
      type: string
      enum:
        - Passed
        - Review
        - Failed
    QcRecord:
      type: object
      required:
        - id
        - recordNo
        - testType
        - sampleDate
        - location
        - material
        - status
        - testedBy
        - details
      properties:
        id:
          type: number
        recordNo:
          type: string
        testType:
          $ref: "#/components/schemas/TestType"
        sampleDate:
          type: string
          format: date
        location:
          type: string
        material:
          type: string
        status:
          $ref: "#/components/schemas/RecordStatus"
        testedBy:
          type: string
        reviewedBy:
          type: ["string", "null"]
        remarks:
          type: ["string", "null"]
        details:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    QcRecordInput:
      type: object
      required:
        - testType
        - sampleDate
        - location
        - material
        - status
        - testedBy
        - details
      properties:
        testType:
          $ref: "#/components/schemas/TestType"
        sampleDate:
          type: string
          format: date
        location:
          type: string
          minLength: 1
        material:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/RecordStatus"
        testedBy:
          type: string
          minLength: 1
        reviewedBy:
          type: ["string", "null"]
        remarks:
          type: ["string", "null"]
        details:
          type: object
          additionalProperties: true
    QcRecordUpdate:
      type: object
      properties:
        testType:
          $ref: "#/components/schemas/TestType"
        sampleDate:
          type: string
          format: date
        location:
          type: string
        material:
          type: string
        status:
          $ref: "#/components/schemas/RecordStatus"
        testedBy:
          type: string
        reviewedBy:
          type: ["string", "null"]
        remarks:
          type: ["string", "null"]
        details:
          type: object
          additionalProperties: true
    Dashboard:
      type: object
      required:
        - totalRecords
        - passedRecords
        - reviewRecords
        - failedRecords
        - recordsThisMonth
        - byType
        - recentRecords
      properties:
        totalRecords:
          type: number
        passedRecords:
          type: number
        reviewRecords:
          type: number
        failedRecords:
          type: number
        recordsThisMonth:
          type: number
        byType:
          type: array
          items:
            $ref: "#/components/schemas/TypeCount"
        recentRecords:
          type: array
          items:
            $ref: "#/components/schemas/QcRecord"
    TypeCount:
      type: object
      required:
        - testType
        - count
      properties:
        testType:
          $ref: "#/components/schemas/TestType"
        count:
          type: number
    Lookups:
      type: object
      required:
        - factories
        - plants
        - employees
        - suppliers
        - materials
        - locations
        - blockTypes
        - blockSizes
        - mixStrengths
        - customers
        - customerLocations
        - sieveSizes
      properties:
        factories:
          type: array
          items:
            type: string
        plants:
          type: array
          items:
            type: string
        employees:
          type: array
          items:
            type: string
        suppliers:
          type: array
          items:
            type: string
        materials:
          type: array
          items:
            type: string
        locations:
          type: array
          items:
            type: string
        blockTypes:
          type: array
          items:
            type: string
        blockSizes:
          type: array
          items:
            type: string
        mixStrengths:
          type: array
          items:
            type: string
        customers:
          type: array
          items:
            type: string
        customerLocations:
          type: array
          items:
            type: string
        sieveSizes:
          type: array
          items:
            type: string
    ReferenceData:
      type: object
      required:
        - categories
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceCategory"
    ReferenceCategory:
      type: object
      required:
        - id
        - key
        - label
        - items
      properties:
        id:
          type: number
        key:
          type: string
        label:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceItem"
    ReferenceItem:
      type: object
      required:
        - id
        - categoryId
        - value
      properties:
        id:
          type: number
        categoryId:
          type: number
        value:
          type: string
    ReferenceCategoryInput:
      type: object
      required:
        - key
        - label
      properties:
        key:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
    ReferenceCategoryUpdate:
      type: object
      properties:
        key:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
    ReferenceItemInput:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          minLength: 1
    StrengthStandard:
      type: object
      required:
        - id
        - testType
        - material
        - blockType
        - blockSize
        - bsStandard
        - requiredStrength
        - strengthUnit
      properties:
        id:
          type: number
        testType:
          $ref: "#/components/schemas/TestType"
        material:
          type: string
        blockType:
          type: ["string", "null"]
        blockSize:
          type: ["string", "null"]
        bsStandard:
          type: string
        requiredStrength:
          type: number
        strengthUnit:
          type: string
    StrengthStandardInput:
      type: object
      required:
        - testType
        - material
        - bsStandard
        - requiredStrength
      properties:
        testType:
          $ref: "#/components/schemas/TestType"
        material:
          type: string
          minLength: 1
        blockType:
          type: ["string", "null"]
        blockSize:
          type: ["string", "null"]
        bsStandard:
          type: string
          minLength: 1
        requiredStrength:
          type: number
          minimum: 0
        strengthUnit:
          type: string
          default: N/mm²
    StrengthStandardUpdate:
      type: object
      properties:
        testType:
          $ref: "#/components/schemas/TestType"
        material:
          type: string
          minLength: 1
        blockType:
          type: ["string", "null"]
        blockSize:
          type: ["string", "null"]
        bsStandard:
          type: string
          minLength: 1
        requiredStrength:
          type: number
          minimum: 0
        strengthUnit:
          type: string
    SieveStandard:
      type: object
      required:
        - id
        - testType
        - materialReferenceItemId
        - material
        - sieveSizeReferenceItemId
        - sieveSize
        - standardReference
        - measurementType
        - minimum
        - maximum
        - unit
      properties:
        id:
          type: number
        testType:
          $ref: "#/components/schemas/TestType"
        materialReferenceItemId:
          type: number
        material:
          type: string
        sieveSizeReferenceItemId:
          type: number
        sieveSize:
          type: string
        standardReference:
          type: string
        measurementType:
          type: string
          enum: [percentage, amount]
        minimum:
          type: ["number", "null"]
        maximum:
          type: ["number", "null"]
        unit:
          type: string
    SieveStandardInput:
      type: object
      required:
        - testType
        - materialReferenceItemId
        - sieveSizeReferenceItemId
        - standardReference
        - measurementType
      properties:
        testType:
